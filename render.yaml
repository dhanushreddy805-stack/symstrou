services:
  # ── FastAPI Backend ──────────────────────────────
  - type: web
    name: symstruo-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: symstruo-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"
      - key: SMTP_HOST
        value: smtp.hostinger.com
      - key: SMTP_PORT
        value: 465
      # Set these in the Render dashboard prompt
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false

  # ── React Frontend (Static Site) ─────────────────
  - type: web
    name: symstruo-frontend
    runtime: static
    rootDir: frontend
    buildCommand: yarn install && yarn build
    staticPublishPath: ./build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://symstruo-backend.onrender.com

# ── Managed PostgreSQL Database ───────────────────
databases:
  - name: symstruo-postgres
    plan: free
    databaseName: symstruo_db
    user: symstruo
